# Kubespray inventory — ppe cluster (ap-south-1, Mumbai)
# AWS hosts in this [all] block are regenerated by scripts/render-inventory.sh
# from `terraform output -json`. Bare-metal lines below are preserved manually.
#
# After `terraform apply -var-file=ppe.tfvars`, run:
#   ./scripts/render-inventory.sh ppe

[all]
# PLACEHOLDERS — replaced by render-inventory.sh once ppe Terraform is applied.
node-1 ansible_host=10.40.10.TBD ip=10.40.10.TBD etcd_member_name=etcd1
node-2 ansible_host=10.40.11.TBD ip=10.40.11.TBD etcd_member_name=etcd2
node-3 ansible_host=10.40.12.TBD ip=10.40.12.TBD etcd_member_name=etcd3
# Future bare-metal joiners — uncomment, set IPs, then run:
#   ./scripts/kubespray.sh ppe scale.yml
# bm-node-1 ansible_host=192.168.20.10 ip=192.168.20.10
# bm-node-2 ansible_host=192.168.20.11 ip=192.168.20.11

# Kubespray detects [bastion] and configures ssh ProxyJump automatically.
[bastion]
bastion ansible_host=BASTION_PUBLIC_IP_TBD ansible_user=ubuntu

[kube_control_plane]
node-1
node-2
node-3

[etcd]
node-1
node-2
node-3

[kube_node]
node-1
node-2
node-3
# bm-node-1
# bm-node-2

[k8s_cluster:children]
kube_control_plane
kube_node

---
# Networking
kube_network_plugin: calico
kube_proxy_mode: ipvs

# Pod and service CIDRs (kubespray defaults — both safe vs the 10.30/16 VPC).
kube_pods_subnet: 10.233.64.0/18
kube_service_addresses: 10.233.0.0/18

# Resource reservations — m5.large/xlarge nodes are tight when the full
# add-on stack lands later, so leave headroom for system + kubelet + etcd.
kube_reserved: true
kube_reserved_cgroups_for_service_slice: kube.slice
kube_reserved_cgroups: "/kube.slice"
kube_memory_reserved: 512Mi
kube_cpu_reserved: 300m

system_reserved: true
system_memory_reserved: 512Mi
system_cpu_reserved: 200m

# Hard eviction thresholds
kubelet_config_extra_args:
  evictionHard:
    memory.available: "100Mi"
    nodefs.available: "5%"
    imagefs.available: "5%"

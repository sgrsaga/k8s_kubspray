---
# VXLAN works on AWS without disabling EC2 src/dst-check (we disable it
# anyway for future MetalLB L2) and works on bare metal without BGP infra.
calico_vxlan_mode: Always
calico_ipip_mode: Never

# AWS VPC default MTU is 9001; setting MTU to 1450 covers VXLAN overhead
# (50 bytes) on a 1500 MTU path. Bump to 8951 only if every hop in the
# cluster (including future BMs) is jumbo-clean.
calico_mtu: 1450

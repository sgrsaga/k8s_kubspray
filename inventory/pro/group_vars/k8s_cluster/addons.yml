---
# Everyday cluster utilities.
helm_enabled: true
metrics_server_enabled: true

# ArgoCD — installed by kubespray. App-of-Apps bootstrap manifests are
# applied separately after cluster.yml finishes.
argocd_enabled: true
argocd_namespace: argocd

# cert-manager — installed by kubespray (with CRDs). ClusterIssuer (Route53
# DNS-01 against <your-route53-zone>) is applied separately after install.
cert_manager_enabled: true
cert_manager_namespace: cert-manager

# MetalLB — disabled. Doesn't work cleanly on AWS EC2 (L2 mode breaks across
# AZs; BGP unsupported). External traffic flow:
#   Route53 A → node public IP : NodePort 30080/30443 → Kong → pod
# (DNS round-robin; no LB, no LB controller.)
metallb_enabled: false

# Storage: Longhorn is installed via a separate playbook
# (playbooks/longhorn.yml) because it isn't a kubespray built-in addon.
# All kubespray-bundled storage provisioners stay off.
local_path_provisioner_enabled: false
local_volume_provisioner_enabled: false
aws_ebs_csi_enabled: false

# Ingress controllers — Kong (Gateway API + Ingress) installed via Helm in
# a later phase as Service type=NodePort with nodePort 30080/30443. The
# kubespray-bundled ingress controllers stay off.
ingress_nginx_enabled: false
ingress_alb_enabled: false

registry_enabled: false

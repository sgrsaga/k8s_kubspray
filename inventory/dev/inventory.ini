# Kubespray inventory — dev cluster
# AWS hosts in this [all] block are regenerated by scripts/render-inventory.sh
# from `terraform output -json`. Bare-metal lines below are preserved manually.
#
# After `terraform apply -var-file=dev.tfvars`, run:
#   ./scripts/render-inventory.sh dev

[all]
# PLACEHOLDERS — replaced by render-inventory.sh once dev Terraform is applied.
node-1 ansible_host=10.30.10.TBD ip=10.30.10.TBD etcd_member_name=etcd1
node-2 ansible_host=10.30.11.TBD ip=10.30.11.TBD etcd_member_name=etcd2
node-3 ansible_host=10.30.12.TBD ip=10.30.12.TBD etcd_member_name=etcd3
# Future bare-metal joiners — uncomment, set IPs, then run:
#   ./scripts/kubespray.sh dev scale.yml
# bm-node-1 ansible_host=192.168.10.10 ip=192.168.10.10
# bm-node-2 ansible_host=192.168.10.11 ip=192.168.10.11

# Kubespray detects [bastion] and configures ssh ProxyJump automatically.
[bastion]
bastion ansible_host=BASTION_PUBLIC_IP_TBD ansible_user=ubuntu

[kube_control_plane]
node-1
node-2
node-3

[etcd]
node-1
node-2
node-3

[kube_node]
node-1
node-2
node-3
# bm-node-1
# bm-node-2

[k8s_cluster:children]
kube_control_plane
kube_node

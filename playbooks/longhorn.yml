---
# Longhorn install — runs against an existing kubespray cluster.
# Two passes:
#   1. Install OS prerequisites (open-iscsi, nfs-common) on every worker
#      and ensure iscsid is running. Longhorn requires these or pods will
#      crashloop on volume attach.
#   2. From the first control-plane node, helm-install Longhorn into the
#      longhorn-system namespace and mark its StorageClass default.
#
# Run via: ./scripts/install-longhorn.sh <env>

- name: Longhorn — install host prerequisites on all worker nodes
  hosts: kube_node
  become: true
  gather_facts: true
  tasks:
    - name: Install open-iscsi and nfs-common
      ansible.builtin.apt:
        name:
          - open-iscsi
          - nfs-common
        state: present
        update_cache: true

    - name: Ensure iscsid is enabled and running
      ansible.builtin.systemd:
        name: iscsid
        enabled: true
        state: started

    - name: Ensure /var/lib/longhorn exists on each node
      ansible.builtin.file:
        path: /var/lib/longhorn
        state: directory
        owner: root
        group: root
        mode: "0755"

- name: Longhorn — helm install from first control-plane node
  hosts: kube_control_plane[0]
  become: true
  gather_facts: false
  vars:
    longhorn_namespace: longhorn-system
    longhorn_chart_version: "1.7.2"
    kubeconfig_path: /etc/kubernetes/admin.conf
  tasks:
    - name: Add Longhorn helm repo
      ansible.builtin.command:
        cmd: helm repo add longhorn https://charts.longhorn.io --force-update
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false

    - name: Update helm repo cache
      ansible.builtin.command:
        cmd: helm repo update
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false

    - name: Install / upgrade Longhorn
      ansible.builtin.command:
        cmd: >-
          helm upgrade --install longhorn longhorn/longhorn
          --namespace {{ longhorn_namespace }}
          --create-namespace
          --version {{ longhorn_chart_version }}
          --set persistence.defaultClass=true
          --set persistence.defaultClassReplicaCount=3
          --set persistence.reclaimPolicy=Retain
          --set defaultSettings.defaultDataPath=/var/lib/longhorn
          --set defaultSettings.defaultReplicaCount=3
          --set defaultSettings.replicaSoftAntiAffinity=true
          --wait --timeout 10m
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: longhorn_install
      changed_when: >-
        ('has been upgraded' in longhorn_install.stdout) or
        ('STATUS: deployed' in longhorn_install.stdout)

    - name: Show Longhorn release status
      ansible.builtin.command:
        cmd: helm status longhorn -n {{ longhorn_namespace }}
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: longhorn_status
      changed_when: false

    - name: Print release summary
      ansible.builtin.debug:
        msg: "{{ longhorn_status.stdout_lines }}"
